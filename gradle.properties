version=1.0-SNAPSHOT
group=org.octopusden.octopus.publishing

# Build JVM heap. CodeQL autobuild traces the Kotlin compiler in-process inside
# the Gradle daemon JVM, whose 512m default heap is exhausted during IR lowering
# (GC overhead limit exceeded on :ft:compileTestKotlin). Bump the heap so the
# instrumented build succeeds; also raise the Kotlin daemon heap for other runs.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g

kotlin.version=2.2.0
nexus-plugin.version=2.0.0
com-jfrog-artifactory.version=6.0.4

# Quality gates (octopusden convention)
octopus-quality.version=2.7.1
detekt.version=1.23.8
ktlint-gradle.version=14.0.1
platformlib-process.version=0.1.4
junit-jupiter.version=5.10.2
assertj.version=3.25.3
xmlunit.version=2.11.0
slf4j.version=2.0.13
logback.version=1.5.18
